<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narrator login</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<script src="/static/login.js" defer></script>
</head>
<body class="login-page">
<main class="login">
  <h1>Narrator</h1>
  <p id="login-error" class="err" hidden>Wrong password.</p>
  <div id="no-password" hidden>
    <p class="err">No password is set yet, so nobody can log in.</p>
    <p>On the narrator machine run <code>narrator --set-password</code>, then reload this page.</p>
  </div>
  <form id="login-form" method="post" action="/auth">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" class="primary">Log in</button>
  </form>
  <p class="small muted">Forgot it? Set a new one with <code>narrator --set-password</code> on the narrator machine.</p>
</main>
</body>
</html>
