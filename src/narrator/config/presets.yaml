# ASR performance presets (asr.preset in config.yaml); see
# narrator.config.presets. Tiers are listed MOST ACCURATE FIRST:
# `narrator --pick-preset` benchmarks this machine and picks the first tier
# it can carry (worker load <= 0.7, caption delay p50 <= 3 s).
#
# A preset covers only model, step_ms and agreement_passes. An explicit
# value in config.yaml always wins over the preset.
#
# measured: false = provisional values, never searched by
# `narrator-tune presets` (make tune-presets), which rewrites this file
# with measured: true rows. `tune:` tells that search how to tune the tier.

tiers:
  quality:
    measured: false
    model: large-v3
    step_ms: 500
    agreement_passes: 2
    note: 'Near-real-time (user decision 2026-11-17: on-screen delay <= ~5 s). With vad_preroll_ms
      300 (defaults.yaml), 42-recording library, RTX 3070 CUDA: screen WER 26.8% -> 24.8%, on-screen
      delay with word pacing p50 2.2 s / p90 4.5 s. Step 1000 x 3 passes was 27.0% dev WER but
      5.6 / 9.2 s on screen with char pacing (users saw ~14 s): rejected.'
    tune:
      max_load: 0.7
  balanced:
    measured: false
    model: medium
    step_ms: 350
    agreement_passes: 2
    note: 'Provisional: the stress-harness baseline in CLAUDE.md (medium + step 350: ~7-10% WER on the
      Piper clips, 0.5-0.8 s finalize latency). large-v3-turbo is a candidate once measured.'
    tune:
      max_load: 0.7
  light:
    measured: false
    model: small
    step_ms: 600
    agreement_passes: 2
    note: 'Provisional: the stress-harness baseline in CLAUDE.md (small + step 600: ~7% WER on the Piper
      clips, ~0.8 s finalize latency). For modest GPUs.'
    tune:
      max_load: 0.7
  cpu:
    measured: false
    model: base
    step_ms: 1000
    agreement_passes: 2
    note: 'Provisional, unmeasured guess: base with a long step so a CPU keeps up.'
    tune:
      unit: cpu
      max_load: 0.7
      search_space:
        step_ms:
        - 800
        - 1000
        - 1500
        - 2000
