app:
  log_level: INFO

audio:
  device: "default"
  sample_rate: 16000
  frame_ms: 30

asr:
  model: "large-v3"
  # The language control. Empty = auto-detect any language, per utterance.
  # With entries, each utterance is decoded in the best-matching listed
  # language (one entry = that language permanently). Editable in the GUI
  # (Audio/ASR tab, dropdown + Add / list + Remove). Whisper transcribes; it
  # has no X->Polish translation.
  language_whitelist: []
  device: auto
  # Which Vulkan GPU to use when several are present. "auto" prefers the
  # first discrete card, so a machine with an iGPU alongside a discrete GPU
  # does not silently run inference on the slow one.
  gpu_device: auto
  vad_threshold: 0.5
  step_ms: 500
  agreement_passes: 2
  end_silence_ms: 650
  # Continuous speech rolls over to a fresh utterance at the smaller of
  # these two (the decode window is never trimmed mid-utterance).
  max_utterance_ms: 20000
  max_context_seconds: 20
  # Audio from just before the VAD fires, prepended to each utterance so
  # the first syllable isn't clipped (0 = off).
  vad_preroll_ms: 0
  # Characters of earlier captions given to whisper as context for the next
  # utterance (0 = off: every utterance starts from a blank context).
  prompt_carryover_chars: 0
  # After this much silence, off-screen caption history is pruned. The
  # visible lines are NOT cleared -- they stay until new speech scrolls them
  # out, an operator clears them (Ctrl+N / the GUI Clear button), or a
  # wipe_screen_after_silence_seconds lull elapses.
  prune_history_after_silence_seconds: 8
  # After this much silence, the screen is truly cleared (like Ctrl+N).
  # 0 disables it (the default: stale captions are usually better than blank
  # ones -- raise this only if very old text would misattribute to new
  # speech, e.g. on a broadcast with long quiet stretches).
  wipe_screen_after_silence_seconds: 0
  show_partial_captions: false

canvas:
  width_px: 1920
  height_px: 1080
  background_color: "#00000000"

layout:
  max_lines: 2
  margin_top_pct: 10.0
  margin_bottom_pct: 5.0
  margin_left_pct: 5.0
  margin_right_pct: 5.0
  interline_pct: 1.0
  text_align: left
  vertical_align_within_box: bottom

style:
  font_family: "assets/fonts/NotoSans-Regular.ttf"
  font_color: "#FFFFFFFF"
  overrides:
    background_band:
      enabled: true
      shape: pill
      color: "#000000A0"
      corner_radius_pct: 2.0
      padding_pct: 1.0
    shadow:
      enabled: false
      offset_x_pct: 0.3
      offset_y_pct: 0.3
      blur_px: 4
      color: "#000000C0"
    stroke:
      enabled: true
      width_px: 2
      color: "#000000FF"

ndi:
  source_name: "LiveCaption"
  fps: 30

gui:
  enabled: true

# Tuning for `narrator --autoconfigure`, which searches the model and decode
# settings (asr.*) under which live captions best match the reference
# transcripts in scripts/test_audio/ and writes the winner into this file.
# Also editable on the GUI's Autoconfigure tab.
autoconfigure:
  candidate_models: ["large-v3", "large-v3-turbo", "medium", "small", "base", "tiny"]
  # Models slower than this multiple of real time can't caption live here.
  slow_factor: 1.5
  # Wall-clock budget for new decoding (results are cached across runs).
  time_budget_minutes: 720
  # Max median delay from spoken word to caption (s); 0 = no cap.
  max_latency_s: 3.0
  # Evaluation sample: fixed-length excerpts spread across recordings.
  excerpt_seconds: 90
  screen_excerpts: 32
  dev_excerpts: 96
  holdout_excerpts: 48
  # Subtitle languages that are scored ("Title (Polish_ASR).srt").
  reference_languages: ["pl"]
  # Drop excerpts whose reference even offline large-v3 can't match.
  max_ceiling_wer: 0.85
  # Disk guards for the decoded-excerpt cache (scripts/autoconfigure_cache).
  min_free_disk_mb: 1024
  cache_max_mb: 1024
  # Optional value grids replacing the built-in ones, e.g. {step_ms: [400, 600]}.
  search_space: {}
