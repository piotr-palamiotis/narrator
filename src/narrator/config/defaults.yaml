app:
  log_level: INFO

audio:
  device: "default"
  sample_rate: 16000
  frame_ms: 30
  # 1-based input channels averaged into mono ([1] = first channel only,
  # [1, 2] = stereo downmix). `device: "ndi:<source name>"` receives audio
  # from an NDI source instead of a microphone.
  channels: [1]

asr:
  # Performance preset (presets.yaml next to this file): supplies model,
  # step_ms and agreement_passes. `narrator --pick-preset` (make setup)
  # benchmarks this machine and sets it; "custom" = no preset. Setting any
  # of those three here overrides the preset for that field. quality =
  # large-v3, step 500, 2 agreement passes (see presets.yaml).
  preset: quality
  # The language control. Empty = auto-detect any language, per utterance.
  # With entries, each utterance is decoded in the best-matching listed
  # language (one entry = that language permanently). Editable in the web UI
  # (ASR tab: language picker + Add / Remove). Whisper transcribes; it
  # has no X->Polish translation.
  language_whitelist: []
  # Processing unit: cpu, vulkan:<n>, cuda:<n> (needs the CUDA build:
  # make asr-backend ASR_GPU=cuda), or
  # auto = the recommended unit when the ASR worker starts (CUDA > discrete
  # Vulkan GPU > CPU > integrated GPU). The web UI's ASR tab lists this
  # machine's units with live usage; picking one there also records its
  # name + PCI bus id (unit_identity), so a shifted GPU index is reported
  # instead of silently running on another card. Replaces device/gpu_device.
  unit: auto
  unit_identity: ""
  vad_threshold: 0.5
  end_silence_ms: 650
  # Continuous speech rolls over to a fresh utterance at the smaller of
  # these two (the decode window is never trimmed mid-utterance).
  max_utterance_ms: 20000
  max_context_seconds: 20
  # Audio from just before the VAD fires, prepended to each utterance so
  # the first syllable isn't clipped (0 = off). 300 measured 2026-11-17 on
  # the reference library (large-v3): 87 errors saved on 30 excerpts, mostly
  # fewer dropped words, no added delay.
  vad_preroll_ms: 300
  # Characters of earlier captions given to whisper as context for the next
  # utterance (0 = off: every utterance starts from a blank context).
  prompt_carryover_chars: 0
  # After this much silence, off-screen caption history is pruned. The
  # visible lines are NOT cleared -- they stay until new speech scrolls them
  # out, an operator clears them (the web UI Clear button / shortcut), or a
  # wipe_screen_after_silence_seconds lull elapses.
  prune_history_after_silence_seconds: 8
  # After this much silence, the screen is truly cleared (like the Clear button).
  # 0 disables it (the default: stale captions are usually better than blank
  # ones -- raise this only if very old text would misattribute to new
  # speech, e.g. on a broadcast with long quiet stretches).
  wipe_screen_after_silence_seconds: 0
  show_partial_captions: false
  # Decode quality gates, applied to every decode (0 = off; narrator-tune
  # measures them). A rejected decode counts as silence for that step.
  # Reject when the mean text-token probability is below this (0-1).
  min_mean_token_p: 0.0
  # Reject when whisper's timestamps run past this multiple of the audio's
  # length -- a hallucination/repetition loop (obs-localvocal uses 2.25).
  max_timestamp_ratio: 0.0
  # Drop whisper's [bracketed] sound annotations such as "[oklaski]".
  strip_bracketed_annotations: true
  # Find-and-replace rules (regular expressions, case-insensitive) applied
  # to every hypothesis before it can be captioned. Example:
  #   text_filters:
  #     - pattern: "\\bnapisy wykonane przez.*"
  #       replacement: ""
  text_filters: []
  # Event vocabulary: names, places and jargon, put at the front of
  # whisper's prompt on every decode (ahead of the prompt carry-over).
  vocabulary: []
  # A saved list to merge in: <config dir>/vocabulary/<name>.txt, one entry
  # per line ("" = none).
  vocabulary_list: ""
  # Replace near-miss spellings ("Kowalsky") with the vocabulary's spelling.
  # Off by default: it can over-snap ordinary words that resemble a name.
  vocabulary_snap: false
  # whisper.cpp flash attention. Can crash the worker on some GPU drivers.
  flash_attn: false
  # Caption-event word times from whisper's DTW alignment (more exact,
  # ~20% more decode time; ignored while flash_attn is on).
  dtw_word_timestamps: false
  # Streaming strategy. local_agreement: re-decode a growing window every
  # step_ms and show what agreement_passes decodes agree on (words trickle
  # out mid-sentence). segmenter: decode each stretch of speech once when it
  # ends (obs-localvocal style); with show_partial_captions the open segment
  # is re-decoded every partial_latency_ms for a live preview. The settings
  # below are the segmenter's.
  decoder: local_agreement
  # vad (a segment per stretch of speech), hybrid (fixed-length segments,
  # partials only while speech is heard) or fixed (fixed-length, no VAD).
  segmentation_mode: vad
  # Partial preview cadence (grows with the segment's length).
  partial_latency_ms: 1100
  # Segment length in hybrid/fixed mode.
  segment_duration_ms: 7000
  # Longest vad segment: continuous speech is cut here (at a short pause
  # once 60% full) and continues in the next segment -- nothing is lost.
  max_segment_ms: 15000
  # Earlier captions given to whisper as context (0 = none).
  context_sentences: 1

canvas:
  width_px: 1920
  height_px: 1080
  background_color: "#00000000"

layout:
  max_lines: 2
  margin_top_pct: 10.0
  margin_bottom_pct: 5.0
  margin_left_pct: 5.0
  margin_right_pct: 5.0
  interline_pct: 1.0
  text_align: left
  vertical_align_within_box: bottom
  # Typewriter-style captions: off, char, word or sentence (speeds up when
  # text backs up; a caption arriving alone appears at once).
  pacing: "off"

style:
  font_family: "assets/fonts/NotoSans-Regular.ttf"
  font_color: "#FFFFFFFF"
  overrides:
    background_band:
      enabled: true
      shape: pill
      color: "#000000A0"
      corner_radius_pct: 2.0
      padding_pct: 1.0
    shadow:
      enabled: false
      offset_x_pct: 0.3
      offset_y_pct: 0.3
      blur_px: 4
      color: "#000000C0"
    stroke:
      enabled: true
      width_px: 2
      color: "#000000FF"

ndi:
  source_name: "LiveCaption"
  fps: 30

# Words that must never reach the screen (live and manual captions). Whole-word, case- and diacritics-insensitive; a
# trailing * is a stem matching every word starting with it ("kurw*").
captions:
  blocklist: []
  # Also use the bundled Polish/English starter list.
  blocklist_builtin: false
  # mask (k***a), replace (with blocklist_replacement) or drop.
  blocklist_action: mask
  blocklist_replacement: "***"

# Browser admin UI (replaces the old Tk GUI). Reachable from other computers
# (login password: `narrator --set-password`); start narrator with
# --local-only to allow this computer only. `narrator --open-ui` opens it.
web:
  enabled: true
  port: 8765
  preview_fps: 5
  # Page-level shortcuts ("" = unbound). Browser-reserved combos such as
  # Ctrl+N/T/W are refused, since a page cannot intercept them.
  shortcuts:
    clear: "Escape"
    mode_toggle: "F2"
    focus_entry: "F4"
    submit: "Enter"
    pause_toggle: "F8"
    help: "?"
  # Per-integration tokens for the control API (Bitfocus Companion, scripts):
  #   - name: companion
  #     token: "<24+ random letters/digits>"
  # Delete an entry to revoke it.
  api_tokens: []
  # OSC (UDP) control input for vMix/QLab/TouchOSC; no authentication, so
  # keep it on loopback.
  osc:
    enabled: false
    bind: "127.0.0.1"
    port: 9000
